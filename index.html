<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Frontfall</title>
  <link rel="stylesheet" href="/src/client/style.css" />
</head>
<body>
  <canvas id="c"></canvas>

  <div id="menu" class="panel center">
    <h1>Frontfall</h1>
    <input id="name" placeholder="Nickname" maxlength="16" />
    <button id="sp">Singleplayer vs bots</button>
    <div id="lobbies"><i>Connecting to server…</i></div>
    <div class="row"><button id="create">Create private game</button><label>Bots <input id="bots" type="number" value="12" min="0" max="40" /></label></div>
    <div class="row"><input id="code" placeholder="Game code" maxlength="5" /><button id="joincode">Join by code</button></div>
  </div>

  <div id="lobby" class="panel center hidden"></div>

  <div id="hud" class="hidden">
    <div id="stats" class="panel"></div>
    <div id="board" class="panel"></div>
    <div id="log" class="panel"></div>
    <div id="bar" class="panel"></div>
    <div id="spawn" class="panel"></div>
    <div id="ctx" class="panel hidden"></div>
    <div id="over" class="panel center hidden"></div>
  </div>

  <script type="module" src="/src/client/main.ts"></script>
</body>
</html>
